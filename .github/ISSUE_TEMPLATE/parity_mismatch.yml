name: Parity mismatch
description: Report a difference in behavior, output, or exit code between oci and boci
title: "[parity]: "
labels: ["parity"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a parity mismatch! `boci` aims for 1:1 parity with `oci-cli==3.96.3`.
        Please redact any OCIDs, namespaces, fingerprints, keys, or tokens before submitting.

  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command invoked (e.g. `os ns get --compartment-id ...`)
      placeholder: "os ns get"
    validations:
      required: true

  - type: textarea
    id: oci-output
    attributes:
      label: "`oci` output (stdout & stderr)"
      description: Output from the Reference `oci` CLI
      render: shell
    validations:
      required: true

  - type: textarea
    id: boci-output
    attributes:
      label: "`boci` output (stdout & stderr)"
      description: Output from `boci`
      render: shell
    validations:
      required: true

  - type: input
    id: exit-codes
    attributes:
      label: Exit codes (`oci` vs `boci`)
      description: Exit status returned by each command
      placeholder: "oci: 0, boci: 2"
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Version info
      description: Output of `boci --version`, `oci --version`, and your OS/architecture
      placeholder: |
        boci --version: 3.96.3
        oci --version: 3.96.3
        OS/arch: Linux x86_64
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any relevant config flags, environment variables, or notes (redacted)
    validations:
      required: false
