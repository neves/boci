name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          bun run build --outfile dist/boci-linux-x64 --target bun-linux-x64
          bun run build --outfile dist/boci-linux-arm64 --target bun-linux-arm64
          bun run build --outfile dist/boci-darwin-x64 --target bun-darwin-x64
          bun run build --outfile dist/boci-darwin-arm64 --target bun-darwin-arm64
          bun run build --outfile dist/boci-windows-x64.exe --target bun-windows-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/boci-linux-x64
            dist/boci-linux-arm64
            dist/boci-darwin-x64
            dist/boci-darwin-arm64
            dist/boci-windows-x64.exe

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --provenance --access public
