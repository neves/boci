name: Test Windows

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Install boci
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/neves/boci/main/site/install.ps1 | iex

      - name: Run boci --version
        shell: pwsh
        run: |
          & "$HOME\.local\bin\boci.exe" --version
