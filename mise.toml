[tools]
python = "3.12"
oci = "3.96.3"
"aqua:boyter/scc" = "latest"
ast-grep = "latest"
"github:oven-sh/bun" = { version = "canary", asset_pattern = "bun-linux-x64.zip", bin_path = "bun-linux-x64" }

[settings]
experimental = true
pipx.uvx = true

[env]
NPM_TOKEN = { age = "" }

[task_config]
includes = ["tasks"]
